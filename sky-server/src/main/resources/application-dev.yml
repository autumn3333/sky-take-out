# 本地开发环境配置
#
# 【安全约定】第三方服务的密钥一律通过环境变量注入，不写进代码仓库。
# 启动前请先设置下列环境变量（Windows 用 set，macOS/Linux 用 export）：
#
#   OSS_ACCESS_KEY_ID       阿里云 OSS AccessKey ID
#   OSS_ACCESS_KEY_SECRET   阿里云 OSS AccessKey Secret
#   WX_APPID                微信小程序 AppID
#   WX_SECRET               微信小程序 AppSecret
#   WX_MCH_ID               微信支付商户号
#   WX_MCH_SERIAL_NO        微信支付商户证书序列号
#   WX_API_V3_KEY           微信支付 APIv3 密钥
#
# 未设置环境变量时应用会启动失败，这是故意的——避免带着空密钥跑到线上才发现。
# 数据库与 Redis 密码保留本地默认值，可另行用 DB_PASSWORD / REDIS_PASSWORD 覆盖。

sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sky_take_out
    username: root
    password: ${DB_PASSWORD:1234}
  alioss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME:your-bucket-name}
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:123456}
    database: 10
  wechat:
    appid: ${WX_APPID}
    secret: ${WX_SECRET}
    mchid: ${WX_MCH_ID}
    mchSerialNo: ${WX_MCH_SERIAL_NO}
    # 商户私钥与平台证书的本地存放路径，按实际情况修改
    privateKeyFilePath: D:\apiclient_key.pem
    apiV3Key: ${WX_API_V3_KEY}
    weChatPayCertFilePath: D:\wechatpay_cert.pem
    # 支付回调地址必须是公网可访问地址，联调时替换为自己的域名或内网穿透地址
    notifyUrl: https://example.com/notify/paySuccess
    refundNotifyUrl: https://example.com/notify/refundSuccess
